[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "property-maintenance-tool-loop"
version = "0.1.0"
description = "A typed FastAPI service that lets an AI coordinator hand maintenance work to inspection reminders."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.52,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
